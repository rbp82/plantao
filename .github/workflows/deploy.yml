name: Deploy Plantão to GitHub Pages

# Publicar = push na main (ou "Run workflow"). Requer Settings → Pages → Source = GitHub Actions.
# O build (web/dist) já contém o app novo, o legado em legado/ e os protocolos em protocolos/ (com index.json).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies (lockfile exato)
        working-directory: ./web
        run: npm ci

      - name: Typecheck
        working-directory: ./web
        run: npm run typecheck

      - name: Tests (calculadoras portadas, paridade dos motores e bateria do app anterior)
        working-directory: ./web
        run: npm test

      - name: Build (Vite + postbuild: sw.js, legado/, protocolos/)
        working-directory: ./web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
