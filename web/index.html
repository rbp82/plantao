<!doctype html>
<html lang="pt-BR" data-theme="light" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plantão</title>
<meta name="description" content="Calculadoras, protocolos e acompanhamento por leito para plantão de UTI e emergência. Dados criptografados no aparelho.">
<meta name="theme-color" content="#F6F5F1">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plantão">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
  /* tema antes de pintar, evitando flash: valor gravado em texto claro fora do cofre */
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem('plantao:theme'));
      var dark = t === 'dark' || ((t === null || t === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.documentElement.className = dark ? 'dark' : 'light';
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px;font-family:system-ui">Ative o JavaScript para usar o Plantão.</p></noscript>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
